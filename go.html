<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando cupón...</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif}
.loader{text-align:center}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.15);border-top-color:#00e676;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:14px;opacity:.7;margin:0}
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p>Cargando tu cupón en DBbet...</p>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('c') || params.get('code');
  var affiliate = 'https://refpa96317.com/L?tag=d_5597863m_11213c_&site=5597863&ad=11213';
  var tag = 'd_5597863m_11213c_';
  var direct = 'https://db-bet.com/es';

  if (!code) {
    // Sin cupón — redirigir directamente al link de afiliado
    window.location.replace(affiliate);
    return;
  }

  // --- FIX: el enfoque anterior usaba un iframe oculto para el affiliate ---
  // Los navegadores modernos (Chrome 80+, Safari, Firefox) bloquean cookies
  // de terceros en iframes (SameSite=Lax por defecto), rompiendo el tracking.
  //
  // Nuevo enfoque:
  // 1. Registrar el click del afiliado via tracking pixel (server-side)
  // 2. Redirigir al usuario con tag de afiliado + cupón en la misma URL

  // Step 1: Tracking pixel — registra el click en el servidor de refpa
  var img = new Image();
  img.src = affiliate;

  // Step 2: Redirigir con tag de afiliado Y código de cupón
  // El tag asegura que DBbet atribuya este usuario al afiliado
  // El load pre-carga el boleto de apuestas
  setTimeout(function() {
    window.location.replace(direct + '?tag=' + encodeURIComponent(tag) + '&load=' + encodeURIComponent(code));
  }, 800);
})();
</script>
</body>
</html>
