<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando cupón...</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif}
.loader{text-align:center}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.15);border-top-color:#00e676;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:14px;opacity:.7;margin:0}
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p>Cargando tu cupón en DBbet...</p>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('c') || params.get('code');
  var affiliate = 'https://refpa96317.com/L?tag=d_5597863m_11213c_&site=5597863&ad=11213';
  var direct = 'https://db-bet.com/es';

  if (!code) {
    window.location.replace(affiliate);
    return;
  }

  // Step 1: Hit the affiliate link in a hidden iframe to set the cookie
  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = affiliate;
  document.body.appendChild(iframe);

  // Step 2: After a short delay for the cookie to set, redirect to the deep link
  setTimeout(function() {
    window.location.replace(direct + '?load=' + encodeURIComponent(code));
  }, 1500);
})();
</script>
</body>
</html>
