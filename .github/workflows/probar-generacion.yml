name: Probar generacion (no publica)

# Corre el generador completo desde los servidores de GitHub SIN guardar ni publicar
# nada. Sirve para confirmar que las credenciales y el feed de DBbet responden.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Generar (en seco)
        env:
          DBBET_CLIENT_ID: ${{ secrets.DBBET_CLIENT_ID }}
          DBBET_CLIENT_SECRET: ${{ secrets.DBBET_CLIENT_SECRET }}
        run: |
          python mp_build.py | grep -E 'ESPN|resolubles|Total:|mp_build'
          python mp_publish_coupons.py | tail -1
          python -c "import history_lib as h;t=h.parse_tickets(open('index.html',encoding='utf-8').read());print(len(t),'billetes');assert len(t)>=5"
