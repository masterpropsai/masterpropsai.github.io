<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:linear-gradient(180deg,#0a0a0f 0%,#0f0f1a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}

.title .ai{color:#d4a520;font-size:32px;vertical-align:super;margin-left:6px;font-family:'Inter';letter-spacing:0}
.sub{font-size:28px;font-weight:700;color:#d4a520;letter-spacing:4px;margin-bottom:28px}
.sep{width:300px;height:1px;background:linear-gradient(90deg,transparent,rgba(212,165,32,0.4),transparent);margin-bottom:24px}
.desc{font-size:22px;color:rgba(255,255,255,0.5);margin-bottom:8px;text-align:center}
.tags{font-size:20px;color:rgba(255,255,255,0.3);margin-top:32px}
.url{font-size:18px;color:#d4a520;margin-top:16px;letter-spacing:1px}
</style></head><body>
<div class="gold-line-top"></div>
<div class="icon">💰</div>
<div class="title">MASTERPROPS<span class="ai">.ai</span></div>
<div class="sub">BILLETES LARGOS CON IA</div>

<div class="tags">⚽ Fútbol  ·  ⚾ MLB  ·  🎾 Tenis  ·  🏀 NBA  ·  🥊 MMA</div>
<div class="url">masterprops.ai</div>
<div class="gold-line-bottom"></div>
</body></html>
